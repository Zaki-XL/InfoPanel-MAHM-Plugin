[PluginInfo]
Name=MSI Afterburner Monitor
Description=Reads GPU metrics (Usage, VRAM, Temp, Fan) safely from MSI Afterburner Shared Memory
Author=Zaki
Version=1.1.1
Website=https://github.com/Zaki-XL/InfoPanel-MAHM-Plugin

[Settings]
; NaN（無効値・未計測値）の際に表示する代替文字列（ダブルクォーテーションで囲んで指定）
; 例: NaText="N/A", NaText="-", NaText="--", NaText=""
NaText="N/A"

